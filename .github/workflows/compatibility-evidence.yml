name: Collect read-only compatibility evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect bounded SA-MP info queries
        run: |
          mkdir -p build
          python3 Tools/Compatibility/query.py
      - name: Inspect public ReSA IPA without execution
        run: python3 Tools/Compatibility/inspect_resa.py
      - name: Save evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-evidence-${{ github.run_id }}
          path: |
            build/compatibility-query.json
            build/resa-static.json
          retention-days: 7
          if-no-files-found: error
